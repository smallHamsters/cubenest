<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  CubeNest 공유 카드(og:image) 생성용 템플릿 — 배포 자산이 아니라 소스다.
  결과물: assets/img/cubenest-og-v2.png (1200×630)

  다시 만들려면 (리포 루트에서):
    py -m http.server 5500
    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless --no-sandbox ^
      --disable-gpu --hide-scrollbars --user-data-dir=%TEMP%\ogprof ^
      --virtual-time-budget=9000 --window-size=1200,630 ^
      --screenshot=assets\img\cubenest-og-v2.png ^
      http://localhost:5500/assets/og/og-card.html

  ⚠ 파일명을 바꿔 저장할 것. og:image 를 읽는 건 브라우저가 아니라 소셜 크롤러이고,
    페이스북·카카오톡은 HTTP 캐시 헤더와 무관하게 무기한 캐시한다. 같은 이름으로
    덮어쓰면 새 카드가 노출되지 않는다. 바꾼 뒤 참조 20곳을 함께 갱신한다.

  오른쪽 삽화는 제품의 겨냥도 렌더러(assets/js/cubenest-iso.js)를 그대로 호출한다 —
  손으로 그리지 않는다. 나무색은 제품이 쓰는 값 그대로다(로고와 달리 학습 대상의 색).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;
       font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;
       background:radial-gradient(120% 100% at 82% 12%,#e9eef4 0%,#eef2f7 46%,#eef2f7 100%);
       display:flex;align-items:center}
  /* 왼쪽 액센트 바 — 사이트 --accent */
  .bar{position:absolute;left:0;top:0;width:14px;height:630px;background:#3f3fbf}
  .copy{padding-left:100px;flex:1 1 0}
  .brand{display:flex;align-items:center;gap:22px;margin-bottom:56px}
  .brand .mark{width:64px;height:64px;flex:0 0 auto}
  .brand b{font-size:64px;font-weight:800;letter-spacing:-.035em;color:#182233;line-height:1}
  .sub{font-size:34px;font-weight:800;letter-spacing:-.02em;color:#3f3fbf;margin:0 0 18px}
  .line{font-size:28px;font-weight:700;letter-spacing:-.01em;color:#182233;margin:0 0 14px}
  .note{font-size:20px;font-weight:500;color:#6a7789;margin:0}
  .art{flex:0 0 480px;display:grid;place-items:center;position:relative;height:630px}
  .art svg{width:360px;height:auto;position:relative;z-index:1}
  .art::after{content:"";position:absolute;bottom:150px;width:300px;height:52px;border-radius:50%;
              background:rgba(24,34,51,.09);filter:blur(2px)}
</style>
</head>
<body>
  <div class="bar"></div>

  <div class="copy">
    <div class="brand">
      <!-- 새 마크 — assets/img/brand-glyph.svg 와 같은 도형 -->
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M13.31,2.55 Q16,1.2 18.69,2.55 L26.76,6.58 Q29.45,7.93 26.76,9.27 L18.69,13.31 Q16,14.65 13.31,13.31 L5.24,9.27 Q2.55,7.93 5.24,6.58 Z" fill="#3f8fd0"/>
        <path d="M2.55,21.06 Q2.55,24.07 5.24,25.42 L13.31,29.45 Q16,30.8 16,27.79 L16,17.66 Q16,14.65 13.31,13.31 L5.24,9.27 Q2.55,7.93 2.55,10.94 Z" fill="#4fae72"/>
        <path d="M29.45,21.06 Q29.45,24.07 26.76,25.42 L18.69,29.45 Q16,30.8 16,27.79 L16,17.66 Q16,14.65 18.69,13.31 L26.76,9.27 Q29.45,7.93 29.45,10.94 Z" fill="#d0546f"/>
      </svg>
      <b>CubeNest</b>
    </div>
    <p class="sub">쌓기나무 3D 학습</p>
    <p class="line">3D로 쌓고 돌려보며 · 개수 · 부피 · 겉넓이</p>
    <p class="note">만든 모양을 링크로 공유하면 똑같이 열려요</p>
  </div>

  <div class="art" id="art"></div>

<script src="../js/cubenest-iso.js"></script>
<script>
  // 3×2 바닥 위의 계단 — 제품이 실제로 그리는 방식 그대로 렌더한다.
  var H = { '0,0':3, '0,1':2, '1,0':2, '1,1':1, '2,0':1, '2,1':1 };
  var cells = [];
  for (var key in H) {
    var p = key.split(',');
    for (var y = 0; y < H[key]; y++) cells.push({ x: +p[0], y: y, z: +p[1] });
  }
  document.getElementById('art').innerHTML =
    CubeNest.iso.renderIso({ gx: 3, gz: 2, cells: cells }, 0);
</script>
</body>
</html>
