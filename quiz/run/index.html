<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="쌓기나무 퀴즈를 직접 풀어요. 개수·부피·겉넓이·위앞옆 관찰." />
    <meta name="theme-color" content="#e9eef4" />

    <!-- 프리뷰 폴백(리포에선 아래 링크가 덮어씀) -->
    <style id="preview-fallback">
      :root{--panel:#fff;--panel-2:#f7f9fc;--bg:#eef2f7;--ink:#182233;--muted:#6a7789;--muted-2:#8a95a6;--line:#e5eaf1;--line-2:#eef2f7;--accent:#3f3fbf;--accent-ink:#2d2d95;--accent-soft:#ecebfb;--add:#0f9d58;--add-soft:#e6f5ec;--del:#e0466b;--del-soft:#fce9ee;--shadow:0 6px 22px rgba(24,34,51,.12),0 1px 3px rgba(24,34,51,.08);--shadow-sm:0 2px 8px rgba(24,34,51,.10);--shadow-lg:0 18px 50px rgba(24,34,51,.16),0 3px 10px rgba(24,34,51,.08);--r:16px;--r-lg:22px;--font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
      header.site-top{display:flex;align-items:center;padding:12px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:50;transition:transform .5s cubic-bezier(.16,1,.3,1)!important;will-change:transform;backface-visibility:hidden}
      header.site-top.hide{transform:translateY(-100%)!important}
      .site-topin{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:1180px;margin:0 auto}
      .site-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
      .site-brand .glyph{width:26px;height:26px}
      .site-brand .t{display:flex;flex-direction:column;line-height:1.05}
      .site-brand .t b{font-weight:800;font-size:15px}.site-brand .t span{font-size:10.5px;color:var(--muted);font-weight:600}
      .site-nav{display:flex;gap:4px;flex-wrap:wrap}
      .site-nav a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
      .site-nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
    </style>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/nav.css" />
    <link rel="stylesheet" href="../../assets/css/consent.css" />
    <style>
      *{box-sizing:border-box}
      [hidden]{display:none!important}
      body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
      main{max-width:720px;margin:0 auto;padding:clamp(14px,3vw,24px) clamp(16px,4vw,32px) 60px}

      .topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
      .exit{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;text-decoration:none;white-space:nowrap}
      .mutebtn{flex:none;width:38px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--muted);display:grid;place-items:center;cursor:pointer}
      .mutebtn:hover{color:var(--ink);border-color:#cfd8e6}
      .mutebtn.on{color:var(--accent-ink)}
      .mutebtn svg{width:18px;height:18px}
      .exit:hover{border-color:#cfd8e6;color:var(--ink)}
      .prog{flex:1}
      .prog .lab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
      .prog .bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
      .prog .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

      .qcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:clamp(16px,3vw,24px)}
      /* 채점 캐릭터 애니메이션 (약 1.3초, 반투명 오버레이·중앙) */
      .gradefx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(247,249,252,.55);border-radius:var(--r-lg);z-index:6;pointer-events:none;animation:fx-out .3s ease 1.15s forwards}
      .gradefx svg{width:min(52%,200px);height:auto;overflow:visible;filter:drop-shadow(0 6px 14px rgba(24,34,51,.14))}
      .fxword{font-family:var(--font);font-weight:900;font-size:clamp(30px,7vw,46px);line-height:1;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 3px 10px rgba(24,34,51,.18);transform-origin:center;animation:fx-word .5s cubic-bezier(.34,1.6,.64,1) both}
      .fxword.good{color:#0f9d58}
      .fxword.oops{color:#e67a45}
      .gradefx .buddy{transform-box:fill-box;transform-origin:50% 100%}
      .gradefx.correct .buddy{animation:fx-pop .42s cubic-bezier(.34,1.56,.64,1) both, fx-bounce .6s ease .42s both}
      .gradefx.wrong .buddy{animation:fx-pop .42s cubic-bezier(.34,1.56,.64,1) both, fx-wobble .55s ease .42s both}
      .gradefx .markO{stroke-dasharray:260;stroke-dashoffset:260;animation:fx-draw .55s ease .12s forwards}
      .gradefx .markX1{stroke-dasharray:80;stroke-dashoffset:80;animation:fx-draw .28s ease .1s forwards}
      .gradefx .markX2{stroke-dasharray:80;stroke-dashoffset:80;animation:fx-draw .28s ease .42s forwards}
      .gradefx .spark{transform-box:fill-box;transform-origin:center;opacity:0}
      .gradefx .s1{animation:fx-spark .7s ease .35s both}
      .gradefx .s2{animation:fx-spark .7s ease .5s both}
      .gradefx .s3{animation:fx-spark .7s ease .62s both}
      .gradefx .sweat{transform-box:fill-box;transform-origin:top center;opacity:0;animation:fx-spark .5s ease .55s both}
      @keyframes fx-pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
      @keyframes fx-bounce{0%{transform:translateY(0)}35%{transform:translateY(-14px)}70%{transform:translateY(0)}85%{transform:translateY(-5px)}100%{transform:translateY(0)}}
      @keyframes fx-wobble{0%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-6deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(2px) rotate(2deg)}100%{transform:translateX(0) rotate(0)}}
      @keyframes fx-draw{to{stroke-dashoffset:0}}
      @keyframes fx-word{0%{transform:scale(.2) translateY(10px);opacity:0}70%{transform:scale(1.12) translateY(0);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
      @keyframes fx-spark{0%{transform:scale(0);opacity:0}45%{opacity:1}100%{transform:scale(1.25);opacity:0}}
      @keyframes fx-out{to{opacity:0}}
      @media (prefers-reduced-motion:reduce){.gradefx *{animation-duration:.01s!important}}
      .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
      .qhead .type{font-weight:800;font-size:15px}
      .qhead .lv{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
      .qhead .mode{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
      .qhead .edge{font-size:12px;font-weight:600;color:var(--muted)}
      .qtext{font-size:clamp(16px,2.4vw,18px);font-weight:700;margin:10px 0 14px;letter-spacing:-.01em}

      .viewer{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
      .viewer svg{width:100%;max-width:360px;height:auto;max-height:230px}
      .rotrow{display:flex;gap:14px;align-items:center;justify-content:center}
      .rotbtn{width:46px;height:46px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer;color:var(--accent-ink);display:grid;place-items:center}
      .rotbtn.wide{width:auto;min-width:78px;height:44px;grid-auto-flow:column;gap:6px;padding:0 12px;font-size:13px;font-weight:800;font-family:inherit}
      .rotbtn.wide span{color:var(--accent-ink)}
      .rotbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
      .rotbtn svg{width:22px;height:22px}
      .compass{width:56px;height:56px;flex:none}
      .compass svg{width:100%;height:100%;display:block}
      .rotcap{font-size:12px;color:var(--muted);font-weight:600;text-align:center;margin-top:2px}
      .rotcap b{color:var(--accent-ink)}
      /* 3D 임베드 뷰어 */
      .v3d{width:100%;height:230px;border-radius:var(--r);overflow:hidden;background:var(--panel-2);touch-action:none}
      .v3d canvas{display:block;width:100%;height:100%}
      .rotrow2{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:8px}
      .compass3{width:56px;height:56px;flex:none}
      .compass3 svg{width:100%;height:100%;display:block}
      .rothint{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;line-height:1.35}
      .rothint b{color:var(--accent-ink)}
      .rothint span{font-size:11px;color:var(--muted-2);font-weight:600}
      .rotbtn2{border:1px solid var(--line);background:var(--panel);color:var(--accent-ink);font-weight:800;font-size:12.5px;padding:9px 13px;border-radius:11px;cursor:pointer;white-space:nowrap}
      .rotbtn2:hover{background:var(--accent-soft);border-color:var(--accent)}

      .answer{margin-top:16px}
      .numin{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .numin input{width:130px;height:48px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:20px;font-weight:800;text-align:center;color:var(--ink);background:var(--panel)}
      .numin input:focus{border-color:var(--accent);outline:none}
      .numin .unit{font-size:16px;font-weight:700;color:var(--muted)}

      .hmgrid{display:inline-grid;gap:4px;background:var(--panel);padding:8px;border:1px solid var(--line);border-radius:12px}
      .hmcell{width:42px;height:42px;border-radius:8px;display:grid;place-items:center}
      .hmcell.empty{background:var(--line-2)}
      .hmcell.fill{background:var(--accent-soft)}
      .hmcell input{width:100%;height:100%;border:1.5px solid var(--accent);border-radius:8px;background:var(--panel);font-family:inherit;font-size:18px;font-weight:800;text-align:center;color:var(--accent-ink)}
      .hmcell input:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
      .hint{font-size:12.5px;color:var(--muted);margin-top:8px}

      .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
      .opt{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:104px;transition:.12s}
      .opt:hover{border-color:#cfd8e6}
      .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
      .opt.correct{border-color:var(--add);background:var(--add-soft)}
      .opt.wrong{border-color:var(--del);background:var(--del-soft)}
      .opt svg{width:88px;height:88px;max-width:100%}

      .actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
      .btn{border:none;cursor:pointer;font-weight:800;font-size:15px;padding:13px 18px;border-radius:14px;background:var(--accent);color:#fff;flex:1}
      .btn:hover{background:var(--accent-ink)}
      .btn:disabled{background:var(--panel-2);color:var(--muted-2);cursor:not-allowed}
      .btn.ghost{background:var(--panel);color:var(--accent-ink);border:1px solid var(--line);flex:0 0 auto}
      .btn.ghost:hover{background:var(--accent-soft)}

      .fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-weight:700;display:none}
      .fb.show{display:block}
      .fb.ok{background:var(--add-soft);color:#0b6e3e;border:1px solid #b7e2c7}
      .fb.no{background:var(--del-soft);color:#a52a49;border:1px solid #f2c3cf}
      .fb .sol{font-weight:600;font-size:13.5px;color:var(--ink);margin-top:6px;opacity:.9}
      .sol-methods{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:4px}
      .sol-hidden{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:4px}
      .sol-draw{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:4px}
      .sol-draw .sol-pic{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
      .sol-draw .sol-pic span{font-size:12px;font-weight:800;color:var(--muted-2)}
      .sol-draw .threeviews{gap:16px}
      .sol-draw .pv svg{width:104px;height:104px;max-height:none}
      .sol-draw .pv span{font-size:13px}
      .sol-draw .expv-hi{width:100%;max-width:340px;height:230px;margin:0 auto}
      .mm-txt{margin-bottom:8px}
      .mm-top{text-align:center;margin:8px 0}
      .mm-top svg{max-width:170px;height:auto}
      .mm-views{display:flex;gap:12px}
      .mmv{flex:1;min-width:120px;text-align:center}
      .mmv-h{font-size:12px;font-weight:800;color:var(--muted-2);margin-bottom:4px}
      .mmv svg{width:100%;height:auto;max-height:150px}
      .expv{width:100%;height:150px;border-radius:10px;overflow:hidden;background:var(--panel-2);touch-action:none}
      .expv-hi{max-width:260px;height:190px;margin:2px auto}
      .sol-hidden .sol-pic{display:flex;flex-direction:column;align-items:center;gap:2px}
      .sol-hidden .sol-pic svg{width:150px;height:auto}
      .sol-hidden .sol-pic span{font-size:12px;font-weight:700;color:var(--muted-2)}
      .sol-pic{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
      .sol-pic svg{display:block}
      .sol-pic span{font-size:11px;color:var(--muted-2);font-weight:700}
      .sol-list{font-size:13px;line-height:1.95;color:var(--ink);min-width:180px}
      .sol-list b{color:var(--accent-ink);font-weight:800}
      .sol-surf{display:flex;flex-direction:column;gap:4px;line-height:1.7}
      .sol-surf b{color:var(--accent-ink);font-weight:800}
      .proj{margin-top:10px}
      .proj-seg{display:inline-flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:8px}
      .pseg{border:none;background:none;font-family:inherit;font-weight:800;font-size:12px;color:var(--muted);padding:5px 12px;border-radius:8px;cursor:pointer}
      .pseg.on{background:var(--panel);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
      .proj-views{display:flex;flex-wrap:wrap;gap:12px}
      .threeviews{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:4px 0 2px}
      .draw{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}
      .dview{display:flex;flex-direction:column;align-items:center;gap:5px}
      .dview span{font-size:13px;font-weight:800;color:var(--muted-2)}
      .dgrid{display:grid;gap:2px;background:var(--line);padding:2px;border-radius:7px}
      .dcell{width:24px;height:24px;background:var(--panel-2);border:none;border-radius:3px;cursor:pointer;padding:0;transition:background .08s}
      .dcell.on{background:var(--accent)}
      .dcell.okcell{background:#4fae72}
      .dcell.misscell{background:var(--panel-2);box-shadow:inset 0 0 0 2.5px #4fae72}
      .dcell.wrongcell{background:#e0455e}
      .dcell:disabled{cursor:default}
      .scratch{margin-top:12px;border:1px dashed var(--line);border-radius:12px;background:var(--panel-2);overflow:hidden}
      .scratch-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;font-size:12px;font-weight:800;color:var(--muted-2)}
      .scratch-left,.scratch-right{display:flex;align-items:center;gap:6px}
      .scratch-left>span{display:none}
      #scratch.collapsed .scratch-left>span{display:inline}
      .scratch-left .fold{background:none;border:none;padding:2px 4px;cursor:pointer;color:var(--muted-2);display:inline-flex;align-items:center;gap:3px}
      .scratch-left .fold .foldtxt{font-size:12px;font-weight:800}
      .scratch-left .fold svg{transition:transform .15s}
      #scratch.collapsed .fold svg{transform:rotate(-90deg)}
      #scratch.collapsed #scratchpad{display:none}
      #scratch.collapsed .pen{display:none}
      #scratch.collapsed .scratch-right{display:none}
      .sc-wrap{position:relative;width:100%;height:clamp(170px,34vh,300px);cursor:crosshair;touch-action:none}
      #scratch.collapsed .sc-wrap{display:none}
      #scratchpad-tutor{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none;background:transparent;pointer-events:none}
      .scratch-tutor{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
      .scratch-tutor .lockmsg{font-size:11.5px;font-weight:800;color:var(--muted-2)}
      .tutor-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
      .tutor-tools .tlabel{font-size:11.5px;font-weight:800;color:var(--del)}
      .tpen{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;padding:0}
      .tpen.on{box-shadow:0 0 0 2px var(--ink)}
      .tutor-btn{font-size:12px;font-weight:800;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--line)}
      #scratch.collapsed .scratch-tutor{display:none}
      #scratch.locked .scratch-left .pen,#scratch.locked #eraser,#scratch.locked #scratchUndo,#scratch.locked #scratchClear{opacity:.35;pointer-events:none}
      .scratch-left .pen{width:20px;height:20px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
      .scratch-left .pen.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
      .scratch-right .tool{font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center}
      .scratch-right .tool.on{background:var(--accent);color:#fff;border-color:var(--accent)}
      .scratch-right .ticon{padding:3px 7px}
      #scratchpad{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none;background:#fff}
      .pv{display:flex;flex-direction:column;align-items:center;gap:3px}
      .pv svg{display:block;height:auto;max-height:66px}
      .pv span{font-size:11px;font-weight:800;color:var(--muted)}
      .proj-views[data-show="3"] .pv:not([data-tri]){display:none}
      .explode-host{width:100%;height:230px;border-radius:12px;overflow:hidden;background:var(--panel-2);touch-action:none;border:1px solid var(--line)}
      .explode-host canvas{display:block;width:100%;height:100%}
      .proj-hint{font-size:11.5px;color:var(--muted-2);font-weight:600;text-align:center;margin-top:6px}

      .result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:clamp(20px,4vw,32px);text-align:center;display:none}
      .result.show{display:block}
      .result h2{margin:0 0 6px;font-size:22px}
      .score{font-size:44px;font-weight:900;color:var(--accent-ink);margin:6px 0}
      .score small{font-size:20px;color:var(--muted-2);font-weight:800}
      .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}      .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
      .dot.o{background:var(--add)}.dot.x{background:var(--del)}
      .qnav{display:flex;align-items:center;gap:10px;margin:2px 0 12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
      .qnav-dots{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
      .labdot{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:2px solid transparent;background:#c3ccda;color:#fff;font-weight:800;font-size:13px;cursor:pointer;padding:0}
      .labdot.o{background:var(--add);color:#fff} .labdot.x{background:var(--del);color:#fff} .labdot.u{background:#eef1f6;color:var(--muted-2);border-color:#d3dbe8}
      .labdot.cur{border-color:var(--ink);transform:scale(1.06)}
      .qnav-result{flex:0 0 auto;font-size:12.5px;font-weight:800;padding:8px 13px;border-radius:10px;background:var(--accent);color:#fff;border:none;cursor:pointer;white-space:nowrap}
      .qnav-result:disabled{background:var(--panel-2);color:var(--muted-2);cursor:default}
      .qnum{color:var(--accent-ink);margin-right:4px}
      .result .actions{max-width:420px;margin:18px auto 0}
      .ractions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:430px;margin:20px auto 0}
      .ractions .btn{width:100%}
      .ractions .btn.wide{grid-column:1/-1}
      .share{margin:18px auto 0;max-width:430px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
      .share span{font-size:13px;font-weight:600;color:var(--muted)}
      .share .sharebtn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:8px 15px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
      .share .sharebtn:hover{background:var(--accent-soft)}
      .share .sharebtn svg{width:15px;height:15px}
      .footnote{color:var(--muted-2);font-size:12px;line-height:1.7;margin:22px 2px 0;text-align:center}
      :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
      .qfb{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
      .qfb:hover{color:var(--accent-ink);border-color:var(--accent)}
      .qfb svg{width:14px;height:14px}
    </style>
  </head>

          <span class="t"><b>CubeNest</b><span>쌓기나무 3D 학습</span></span>
        </a>
        <nav class="site-nav" aria-label="주요 메뉴">

      </div>

      <section class="qcard" id="qcard" aria-live="polite"></section>

      <div class="scratch" id="scratch" hidden>
        <div class="scratch-bar">
          <div class="scratch-left"><button type="button" class="fold" id="scratchFold" aria-label="연습장 접기/펼치기"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg><span class="foldtxt" id="foldtxt">접기</span></button><span>✏️ 연습장</span>
            <button type="button" class="pen on" data-col="#2d2d3a" style="--c:#2d2d3a" aria-label="검정"></button>

            <button type="button" class="pen" data-col="#f5820a" style="--c:#f5820a" aria-label="주황"></button>
          </div>
          <div class="scratch-right">
            <button type="button" class="tool ticon" id="scratchUndo" title="되돌리기" aria-label="되돌리기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg></button>
            <button type="button" class="tool ticon" id="eraser" title="지우개" aria-label="지우개"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M6.5 16.5l7-7a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8l-6 6H9z"/></svg></button>
            <button type="button" class="tool" id="scratchClear">전체삭제</button>
          </div>
        </div>
        <div class="sc-wrap" id="scWrap">
          <canvas id="scratchpad"></canvas>
          <canvas id="scratchpad-tutor"></canvas>
        </div>
        <div class="scratch-tutor" id="scratchTutor" hidden>
          <span class="lockmsg">🔒 아이 풀이 잠금</span>
          <div class="tutor-tools" id="tutorTools" hidden>
            <span class="tlabel">✏️ 첨삭</span>
            <button type="button" class="tpen on" data-col="#e0455e" style="--c:#e0455e" aria-label="빨강"></button>
            <button type="button" class="tpen" data-col="#2b6fe0" style="--c:#2b6fe0" aria-label="파랑"></button>
            <button type="button" class="tool ticon" id="tutorEraser" title="지우개" aria-label="지우개"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M6.5 16.5l7-7a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8l-6 6H9z"/></svg></button>
            <button type="button" class="tool ticon" id="tutorUndo" title="되돌리기" aria-label="되돌리기"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg></button>
            <button type="button" class="tool" id="tutorClear">지우기</button>
            <button type="button" class="tool" id="tutorDone">첨삭 종료</button>
          </div>
          <button type="button" class="tool tutor-btn" id="tutorLoginBtn">🔓 로그인(모의)</button>
          <button type="button" class="tool tutor-btn" id="tutorBtn" hidden>✏️ 첨삭 시작</button>
        </div>
      </div>

      <div class="fb" id="fb" hidden></div>
      <div class="actions" id="actions" hidden></div>

      <section class="result" id="result"></section>

      <p class="footnote">모든 문제는 CubeNest가 자체 제작·보유한 자산입니다.</p>
    </main>

    </div>
