    <style id="preview-fallback">
      :root{--panel:#fff;--panel-2:#f7f9fc;--bg:#eef2f7;--ink:#182233;--muted:#6a7789;--muted-2:#8a95a6;--line:#e5eaf1;--line-2:#eef2f7;--accent:#3f3fbf;--accent-ink:#2d2d95;--accent-soft:#ecebfb;--add:#0f9d58;--add-soft:#e6f5ec;--del:#e0466b;--del-soft:#fce9ee;--shadow:0 6px 22px rgba(24,34,51,.12),0 1px 3px rgba(24,34,51,.08);--shadow-sm:0 2px 8px rgba(24,34,51,.10);--shadow-lg:0 18px 50px rgba(24,34,51,.16),0 3px 10px rgba(24,34,51,.08);--r:16px;--r-lg:22px;--font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
      .site-top{display:flex;align-items:center;padding:12px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:#fff}
      .site-topin{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:1180px;margin:0 auto}

      .site-nav{display:flex;gap:4px;flex-wrap:wrap}

    <style>
      *{box-sizing:border-box}
      body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
      main{max-width:720px;margin:0 auto;padding:clamp(14px,3vw,24px) clamp(16px,4vw,32px) 60px}

      .topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
      .exit{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;text-decoration:none;white-space:nowrap}
      .exit:hover{border-color:#cfd8e6;color:var(--ink)}
      .prog{flex:1}
      .prog .lab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
      .prog .bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
      .prog .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

      .qcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:clamp(16px,3vw,24px)}
      /* 채점 캐릭터 애니메이션 (약 1.3초) */
      .gradefx{position:absolute;inset:0;display:grid;place-items:center;background:rgba(247,249,252,.74);border-radius:var(--r-lg);z-index:6;pointer-events:none;animation:fx-out .3s ease 1.05s forwards}
      .gradefx svg{width:min(62%,240px);height:auto;overflow:visible}
      .gradefx .buddy{transform-box:fill-box;transform-origin:50% 100%}
      .gradefx.correct .buddy{animation:fx-pop .42s cubic-bezier(.34,1.56,.64,1) both, fx-bounce .6s ease .42s both}
      .gradefx.wrong .buddy{animation:fx-pop .42s cubic-bezier(.34,1.56,.64,1) both, fx-wobble .55s ease .42s both}
      .gradefx .markO{stroke-dasharray:260;stroke-dashoffset:260;animation:fx-draw .55s ease .12s forwards}
      .gradefx .markX1{stroke-dasharray:80;stroke-dashoffset:80;animation:fx-draw .28s ease .1s forwards}
      .gradefx .markX2{stroke-dasharray:80;stroke-dashoffset:80;animation:fx-draw .28s ease .42s forwards}
      .gradefx .spark{transform-box:fill-box;transform-origin:center;opacity:0}
      .gradefx .s1{animation:fx-spark .7s ease .35s both}
      .gradefx .s2{animation:fx-spark .7s ease .5s both}
      .gradefx .s3{animation:fx-spark .7s ease .62s both}
      .gradefx .sweat{transform-box:fill-box;transform-origin:top center;opacity:0;animation:fx-spark .5s ease .55s both}
      @keyframes fx-pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
      @keyframes fx-bounce{0%{transform:translateY(0)}35%{transform:translateY(-14px)}70%{transform:translateY(0)}85%{transform:translateY(-5px)}100%{transform:translateY(0)}}
      @keyframes fx-wobble{0%{transform:translateX(0) rotate(0)}20%{transform:translateX(-6px) rotate(-6deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(2px) rotate(2deg)}100%{transform:translateX(0) rotate(0)}}
      @keyframes fx-draw{to{stroke-dashoffset:0}}
      @keyframes fx-spark{0%{transform:scale(0);opacity:0}45%{opacity:1}100%{transform:scale(1.25);opacity:0}}
      @keyframes fx-out{to{opacity:0}}
      @media (prefers-reduced-motion:reduce){.gradefx *{animation-duration:.01s!important}}
      .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
      .qhead .type{font-weight:800;font-size:15px}
      .qhead .lv{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
      .qhead .mode{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
      .qhead .edge{font-size:12px;font-weight:600;color:var(--muted)}
      .qtext{font-size:clamp(16px,2.4vw,18px);font-weight:700;margin:10px 0 14px;letter-spacing:-.01em}

      .viewer{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
      .viewer svg{width:100%;max-width:360px;height:auto;max-height:230px}
      .rotrow{display:flex;gap:14px;align-items:center;justify-content:center}
      .rotbtn{width:46px;height:46px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer;color:var(--accent-ink);display:grid;place-items:center}
      .rotbtn.wide{width:auto;min-width:78px;height:44px;grid-auto-flow:column;gap:6px;padding:0 12px;font-size:13px;font-weight:800;font-family:inherit}
      .rotbtn.wide span{color:var(--accent-ink)}
      .rotbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
      .rotbtn svg{width:22px;height:22px}
      .compass{width:56px;height:56px;flex:none}
      .compass svg{width:100%;height:100%;display:block}
      .rotcap{font-size:12px;color:var(--muted);font-weight:600;text-align:center;margin-top:2px}
      .rotcap b{color:var(--accent-ink)}
      /* 3D 임베드 뷰어 */
      .v3d{width:100%;height:230px;border-radius:var(--r);overflow:hidden;background:var(--panel-2);touch-action:none}
      .v3d canvas{display:block;width:100%;height:100%}
      .rotrow2{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:8px}
      .compass3{width:56px;height:56px;flex:none}
      .compass3 svg{width:100%;height:100%;display:block}
      .rothint{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;line-height:1.35}
      .rothint b{color:var(--accent-ink)}
      .rothint span{font-size:11px;color:var(--muted-2);font-weight:600}
      .rotbtn2{border:1px solid var(--line);background:var(--panel);color:var(--accent-ink);font-weight:800;font-size:12.5px;padding:9px 13px;border-radius:11px;cursor:pointer;white-space:nowrap}
      .rotbtn2:hover{background:var(--accent-soft);border-color:var(--accent)}

      .answer{margin-top:16px}
      .numin{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .numin input{width:130px;height:48px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:20px;font-weight:800;text-align:center;color:var(--ink);background:var(--panel)}
      .numin input:focus{border-color:var(--accent);outline:none}
      .numin .unit{font-size:16px;font-weight:700;color:var(--muted)}

      .hmgrid{display:inline-grid;gap:4px;background:var(--panel);padding:8px;border:1px solid var(--line);border-radius:12px}
      .hmcell{width:42px;height:42px;border-radius:8px;display:grid;place-items:center}
      .hmcell.empty{background:var(--line-2)}
      .hmcell.fill{background:var(--accent-soft)}
      .hmcell input{width:100%;height:100%;border:1.5px solid var(--accent);border-radius:8px;background:var(--panel);font-family:inherit;font-size:18px;font-weight:800;text-align:center;color:var(--accent-ink)}
      .hmcell input:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
      .hint{font-size:12.5px;color:var(--muted);margin-top:8px}

      .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
      .opt{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;cursor:pointer;display:flex;justify-content:center;transition:.12s}
      .opt:hover{border-color:#cfd8e6}
      .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
      .opt.correct{border-color:var(--add);background:var(--add-soft)}
      .opt.wrong{border-color:var(--del);background:var(--del-soft)}
      .opt svg{height:74px;width:auto}

      .actions{margin-top:18px;display:flex;gap:10px}
      .btn{border:none;cursor:pointer;font-weight:800;font-size:15px;padding:13px 18px;border-radius:14px;background:var(--accent);color:#fff;flex:1}
      .btn:hover{background:var(--accent-ink)}
      .btn:disabled{background:var(--panel-2);color:var(--muted-2);cursor:not-allowed}
      .btn.ghost{background:var(--panel);color:var(--accent-ink);border:1px solid var(--line);flex:0 0 auto}
      .btn.ghost:hover{background:var(--accent-soft)}

      .fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-weight:700;display:none}
      .fb.show{display:block}
      .fb.ok{background:var(--add-soft);color:#0b6e3e;border:1px solid #b7e2c7}
      .fb.no{background:var(--del-soft);color:#a52a49;border:1px solid #f2c3cf}
      .fb .sol{font-weight:600;font-size:13.5px;color:var(--ink);margin-top:6px;opacity:.9}

      .result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:clamp(20px,4vw,32px);text-align:center;display:none}
      .result.show{display:block}
      .result h2{margin:0 0 6px;font-size:22px}
      .score{font-size:44px;font-weight:900;color:var(--accent-ink);margin:6px 0}
      .score small{font-size:20px;color:var(--muted-2);font-weight:800}
      .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}
      .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
      .dot.o{background:var(--add)}.dot.x{background:var(--del)}
      .result .actions{max-width:420px;margin:18px auto 0}
      .footnote{color:var(--muted-2);font-size:12px;line-height:1.7;margin:22px 2px 0;text-align:center}
      :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
      .qfb{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
      .qfb:hover{color:var(--accent-ink);border-color:var(--accent)}
      .qfb svg{width:14px;height:14px}
    </style>
  </head>
  <body>
    <header class="site-top">
      <div class="site-topin">

          <img class="glyph" src="../../assets/img/brand-glyph.svg" alt="" role="presentation" />

    <main>
      <div class="topbar" id="topbar">
        <a class="exit" href="../">← 나가기</a>
        <div class="prog">
          <div class="lab"><span id="pg-type">개수 세기</span><span id="pg-num">1 / 10</span></div>
          <div class="bar"><div class="fill" id="pg-fill" style="width:0%"></div></div>
        </div>
      </div>

      <section class="qcard" id="qcard" aria-live="polite"></section>

      <section class="result" id="result"></section>

      <p class="footnote">모든 문제는 CubeNest가 자체 제작·보유한 자산입니다.</p>
    </main>


    <script>
      /* ===== 시드 RNG ===== */
      function xmur3(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;};}
      function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      function rngFrom(str){const s=xmur3(str);return mulberry32(s());}

      /* ===== 유형 · 난이도 설정 ===== */
      const TYPES={
        count:{title:"개수 세기",ask:"쌓기나무는 모두 몇 개일까요?",form:"num",unit:"개"},
        volume:{title:"부피 구하기",ask:"이 모양의 부피는 얼마일까요?",form:"num",unit:"cm³",edge:true},
        surface:{title:"겉넓이 구하기",ask:"겉넓이는 얼마일까요? (바닥 포함)",form:"num",unit:"cm²",edge:true},
        heightmap:{title:"위에서 본 수 쓰기",ask:"위에서 본 모양의 각 칸에 쌓인 나무 수를 쓰세요.",form:"hm"},
        facesMc:{title:"위·앞·옆 모양 고르기",ask:"이 모양을 앞에서 본 모양을 고르세요.",form:"mc"},
      };
      /* gen_config (분류 체계 §7.3) — 정본은 assets/js/quiz/gen-config.json.
         아래는 프리뷰/오프라인 폴백 사본(리포에선 fetch로 덮어씀). */
      const INLINE_CONFIG={
        version:"0.1.0",
        levels:{
          "하":{gx:3,gz:3,maxH:2,fMin:3,fMax:4,nMin:4,nMax:6,edge:1},
          "중":{gx:3,gz:3,maxH:3,fMin:4,fMax:5,nMin:6,nMax:9,edge:1},
          "상":{gx:4,gz:4,maxH:3,fMin:5,fMax:7,nMin:9,nMax:14,edge:2},
          "최상":{gx:4,gz:4,maxH:4,fMin:6,fMax:9,nMin:12,nMax:18,edge:2},
        }
      };
      let GEN_CONFIG=INLINE_CONFIG;
      const LVCODE={1:"하",2:"중",3:"상",4:"최상"};

      /* F1 계측 — 동의 후 로드된 gtag가 있을 때만(오리진 공유 consent 정본). */
      function track(name,params){ try{ if(window.gtag) window.gtag('event',name,params||{}); }catch(e){} }

      /* ===== 의견·오류 신고 (playground 피드백 패턴 재사용) =====
         배포 설정: 아래 3개를 quiz용 구글폼 값으로 채운다.
         · FEEDBACK_VIEWFORM_URL = 폼 '보기' 주소(…/viewform)
         · FEEDBACK_ENTRY_CTX    = '문제 정보(자동 채움)' 질문의 entry ID
                                    (폼 편집 → ⋮ → '미리 채워진 링크 가져오기'로 획득, 예 "entry.123456789")
         · FEEDBACK_FORM_URL     = 단축 링크(미리채우기 미설정 시 기본 열기) */
      const FEEDBACK_FORM_URL     = "https://docs.google.com/forms/d/e/1FAIpQLSe-FKqQrDKF_hG7a6TC5wkzCLy2HVYKZIDGZLna1PJToSnXyA/viewform";
      const FEEDBACK_VIEWFORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe-FKqQrDKF_hG7a6TC5wkzCLy2HVYKZIDGZLna1PJToSnXyA/viewform";
      const FEEDBACK_ENTRY_CTX    = "entry.200601468"; // '문제 정보(자동 채움)' 질문
      function deviceInfo(){
        const ua=navigator.userAgent||""; let m,br;
        if(m=ua.match(/SamsungBrowser\/([\d.]+)/)) br="삼성인터넷 "+m[1];
        else if(m=ua.match(/Edg\/([\d.]+)/)) br="Edge "+m[1];
        else if(m=ua.match(/OPR\/([\d.]+)/)) br="Opera "+m[1];
        else if(m=ua.match(/Firefox\/([\d.]+)/)) br="Firefox "+m[1];
        else if(m=ua.match(/Chrome\/([\d.]+)/)) br="Chrome "+m[1];
        else if(m=ua.match(/Version\/([\d.]+).*Safari/)) br="Safari "+m[1];
        else br="알 수 없음";
        let os;
        if(m=ua.match(/Android[^;]*;\s*([^)]+)\)/)) os="Android · "+m[1].replace(/;.*/,"").replace(/\s*Build.*/i,"").trim();
        else if(/iPhone/.test(ua)) os="iPhone (iOS)";
        else if(/iPad/.test(ua)) os="iPad";
        else if(/Windows/.test(ua)) os="Windows";
        else if(/Mac OS X|Macintosh/.test(ua)) os="macOS";
        else os="기타";
        return os+" · "+br;
      }
      function quizContext(){
        const pr=(typeof S!=="undefined"&&S.probs&&S.probs[S.idx])||{}, T=(pr.type&&TYPES[pr.type])||{};
        const viewLabel=(window.THREE&&PRM.dim!=="2d")?"3D 문제":"2D 겨냥도";
        return "(개선·오류 신고 시 아래 정보가 도움이 됩니다. 필요 없으면 지워 주세요.)\n"
          + "유형: "+(T.title||pr.type||"-")+" · 난이도: "+(pr.lv||"-")+" · 문항: "+(S.idx+1)+"/"+S.n+"\n"
          + "보기 형태: "+viewLabel+"\n"
          + "재현 링크: "+location.href+"  (이 링크의 "+(S.idx+1)+"번째 문항)\n"
          + "기기/브라우저: "+deviceInfo()+" · 화면 "+window.innerWidth+"×"+window.innerHeight+"\n"
          + "UA: "+(navigator.userAgent||"")+"\n─────────\n개선/오류 내용: ";
      }
      function feedbackHref(){
        const viewReady=FEEDBACK_VIEWFORM_URL && !/X{4,}/.test(FEEDBACK_VIEWFORM_URL);
        const formReady=FEEDBACK_FORM_URL && !/X{4,}/.test(FEEDBACK_FORM_URL);
        if(FEEDBACK_ENTRY_CTX && viewReady){
          const id=/^entry\./.test(FEEDBACK_ENTRY_CTX)?FEEDBACK_ENTRY_CTX:("entry."+FEEDBACK_ENTRY_CTX);
          return FEEDBACK_VIEWFORM_URL+"?usp=pp_url&"+id+"="+encodeURIComponent(quizContext());
        }
        return formReady?FEEDBACK_FORM_URL:null;
      }
      function openFeedback(){

      /* ===== 모양 생성 ===== */
      function genShape(rng,cfg){

      }

        const viewerHTML=has3D
          ? `<div class="viewer"><div id="v3d" class="v3d"></div><div class="rotrow2"><div class="compass3"><svg id="compassSvg" viewBox="0 0 74 74"></svg></div><div class="rothint">돌려서 <b>숨은 나무</b>를 확인해요<br><span>손가락·마우스로 회전</span></div><button id="reset3d" class="rotbtn2" type="button">정면</button></div></div>`
          : `<div class="viewer"><div id="iso">${renderIso(sh,0)}</div><div class="rotrow"><button id="rl" class="rotbtn wide" type="button" aria-label="왼쪽으로 90도 돌리기">${ARC_CCW}<span>90°</span></button><div id="compass" class="compass" aria-hidden="true">${renderCompass(0)}</div><button id="rr" class="rotbtn wide" type="button" aria-label="오른쪽으로 90도 돌리기">${ARC_CW}<span>90°</span></button></div><div class="rotcap" id="rotcap">버튼으로 쌓기나무를 <b>돌려서</b> 뒤·옆면을 확인해요</div></div>`;
        qcard.innerHTML=`
          <div class="qhead"><span class="type">${T.title}</span><span class="lv">${pr.lv}</span><span class="mode">${viewLabel}</span>${edge}<button type="button" id="feedbackBtn" class="qfb" aria-label="이 문제에 의견 보내기"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>의견</span></button></div>
          <div class="qtext">${T.ask}</div>
          ${viewerHTML}
          <div class="answer">${ans}</div>
          <div class="fb" id="fb"></div>
          <div class="actions"><button class="btn" id="submit">제출</button></div>`;
        if(CURVIEW&&CURVIEW.dispose){CURVIEW.dispose();CURVIEW=null;}
        if(has3D){
          CURVIEW=mount3D(document.getElementById("v3d"),sh,document.getElementById("compassSvg"));
          const rb=document.getElementById("reset3d"); if(rb)rb.onclick=()=>{CURVIEW&&CURVIEW.reset();track("quiz_view_reset",{});};
        }else{
          const updRot=()=>{document.getElementById("iso").innerHTML=renderIso(sh,ROT);document.getElementById("compass").innerHTML=renderCompass(ROT);document.getElementById("rotcap").innerHTML=`버튼으로 쌓기나무를 <b>돌려서</b> 뒤·옆면을 확인해요`;};
          document.getElementById("rl").onclick=()=>{ROT=(ROT+3)%4;updRot();track("quiz_rotate",{dir:"ccw",deg:ROT*90});};
          document.getElementById("rr").onclick=()=>{ROT=(ROT+1)%4;updRot();track("quiz_rotate",{dir:"cw",deg:ROT*90});};
        }
        if(T.form==="mc"){qcard.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.classList.contains("done"))return;PICK=+b.dataset.i;qcard.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));b.classList.add("sel");});}
        document.getElementById("submit").onclick=submit;
        document.getElementById("feedbackBtn").onclick=openFeedback;
        const first=qcard.querySelector("input");if(first)first.focus();
      }

      /* ===== 채점 캐릭터 (브랜드 큐브 버디) ===== */
      function gradeSVG(ok){
        if(ok){
          return `<svg viewBox="0 0 220 210" xmlns="http://www.w3.org/2000/svg">
            <g fill="#f4c542">
              <path class="spark s1" d="M46 44 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
              <path class="spark s2" d="M182 34 l3.2 8 8 3.2 -8 3.2 -3.2 8 -3.2 -8 -8 -3.2 8 -3.2z"/>
              <path class="spark s3" d="M190 98 l3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3z"/>
            </g>
            <circle class="mark markO" cx="110" cy="66" r="40" fill="none" stroke="#0f9d58" stroke-width="12" stroke-linecap="round"/>
            <g class="buddy">
              <path d="M70 130 L110 118 L150 130 L110 142z" fill="#f0d9b4" stroke="#c8965a" stroke-width="2.5" stroke-linejoin="round"/>
              <rect x="70" y="130" width="80" height="64" rx="11" fill="#e6c9a0" stroke="#c8965a" stroke-width="3"/>
              <rect x="53" y="132" width="10" height="26" rx="5" fill="#d8a76e" transform="rotate(30 58 145)"/>
              <rect x="157" y="132" width="10" height="26" rx="5" fill="#d8a76e" transform="rotate(-30 162 145)"/>
              <path d="M85 153 q6 -8 12 0" fill="none" stroke="#5b4327" stroke-width="4" stroke-linecap="round"/>
              <path d="M123 153 q6 -8 12 0" fill="none" stroke="#5b4327" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="83" cy="168" rx="6" ry="4" fill="#e88f96" opacity=".65"/>
              <ellipse cx="137" cy="168" rx="6" ry="4" fill="#e88f96" opacity=".65"/>
              <path d="M99 166 q11 14 22 0 z" fill="#8a4a3a"/>
            </g>
          </svg>`;
        }
        return `<svg viewBox="0 0 220 210" xmlns="http://www.w3.org/2000/svg">
          <path class="mark markX1" d="M84 40 L136 92" fill="none" stroke="#e0466b" stroke-width="12" stroke-linecap="round"/>
          <path class="mark markX2" d="M136 40 L84 92" fill="none" stroke="#e0466b" stroke-width="12" stroke-linecap="round"/>
          <g class="buddy">
            <path d="M70 130 L110 118 L150 130 L110 142z" fill="#f0d9b4" stroke="#c8965a" stroke-width="2.5" stroke-linejoin="round"/>
            <rect x="70" y="130" width="80" height="64" rx="11" fill="#e6c9a0" stroke="#c8965a" stroke-width="3"/>
            <rect x="57" y="142" width="10" height="24" rx="5" fill="#d8a76e"/>
            <rect x="153" y="142" width="10" height="24" rx="5" fill="#d8a76e"/>
            <circle cx="92" cy="156" r="6" fill="#5b4327"/>
            <circle cx="128" cy="156" r="6" fill="#5b4327"/>
            <circle cx="94.3" cy="153.6" r="2" fill="#fff"/>
            <circle cx="130.3" cy="153.6" r="2" fill="#fff"/>
            <path d="M85 147 q7 -3.5 13 0" fill="none" stroke="#5b4327" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
            <path d="M135 147 q-7 -3.5 -13 0" fill="none" stroke="#5b4327" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
            <path class="sweat" d="M150 150 q6 9 0 14 q-6 -5 0 -14z" fill="#7cc6e8"/>
            <ellipse cx="110" cy="177" rx="5.2" ry="4.4" fill="#8a4a3a"/>
          </g>
        </svg>`;
      }
      function playGrade(ok,cb){
        const fx=document.createElement("div");
        fx.className="gradefx "+(ok?"correct":"wrong");
        fx.innerHTML=gradeSVG(ok);
        qcard.appendChild(fx);
        setTimeout(()=>{ fx.remove(); cb(); }, 1300);
      }
      function submit(){
        const pr=S.probs[S.idx],T=TYPES[pr.type],sh=pr.sh;
        let ok=false,sol="";
        if(T.form==="num"){
          const v=parseInt(document.getElementById("ans").value,10);
          if(isNaN(v)){document.getElementById("ans").focus();return;}
          let a=sh.count;
          if(pr.type==="volume"){a=sh.count*sh.edge**3;sol=`${sh.count}개 × (${sh.edge}cm)³ = ${a}cm³`;}
          else if(pr.type==="surface"){a=sh.exposed*sh.edge**2;sol=`드러난 면 ${sh.exposed}개 × (${sh.edge}cm)² = ${a}cm²`;}
          else sol=`채운 칸을 모두 세면 ${a}개예요.`;
          ok=v===a;
        }else if(T.form==="hm"){
          ok=true;let bad=false;
          qcard.querySelectorAll(".hmcell input").forEach(inp=>{const x=+inp.dataset.x,z=+inp.dataset.z;const v=parseInt(inp.value,10);if(isNaN(v)){bad=true;}if(v!==sh.hmap[x][z]){ok=false;inp.style.borderColor="var(--del)";}else{inp.style.borderColor="var(--add)";}inp.disabled=true;});
          if(bad&&ok===true){/*빈칸 있으면 오답 처리*/}
          if(bad)ok=false;
          sol="각 칸의 수 = 그 자리에 쌓인 나무 층 수예요.";
        }else if(T.form==="mc"){
          if(PICK<0)return;
          ok=PICK===pr.correct;
          qcard.querySelectorAll(".opt").forEach((o,i)=>{o.classList.add("done");if(i===pr.correct)o.classList.add("correct");else if(i===PICK)o.classList.add("wrong");o.style.pointerEvents="none";});
          sol="앞에서 볼 때 각 줄의 가장 높은 칸까지 보여요.";
        }
        S.answered[S.idx]=ok;
        track("quiz_answer",{type:pr.type,level:pr.lv,correct:ok,idx:S.idx});
        const sb=document.getElementById("submit"); if(sb)sb.disabled=true;
        playGrade(ok,()=>{
          const fb=document.getElementById("fb");
          fb.className="fb show "+(ok?"ok":"no");
          fb.innerHTML=(ok?"⭕ 정답이에요!":"❌ 아쉬워요")+`<div class="sol">${sol}</div>`;
          const act=qcard.querySelector(".actions");
          act.innerHTML=`<button class="btn" id="next">${S.idx+1<S.n?"다음 →":"결과 보기"}</button>`;
          document.getElementById("next").onclick=next;
          document.getElementById("pg-fill").style.width=((S.idx+1)/S.n*100)+"%";
        });
      }
      function next(){if(S.idx+1<S.n){S.idx++;renderProblem();window.scrollTo({top:0,behavior:"smooth"});}else showResult();}

      function showResult(){
        if(CURVIEW&&CURVIEW.dispose){CURVIEW.dispose();CURVIEW=null;}
        qcard.style.display="none";document.getElementById("topbar").style.display="none";
        const score=S.answered.filter(Boolean).length;
        const dots=S.answered.map((o,i)=>`<span class="dot ${o?'o':'x'}">${i+1}</span>`).join("");
        try{localStorage.setItem("cubenest_quiz_last",JSON.stringify({type:S.type,seed:S.seed,n:S.n,score,ts:Date.now()}));}catch(e){}
        track("quiz_run_complete",{type:S.type,n:S.n,score,seed:S.seed});
        resultEl.className="result show";
        resultEl.innerHTML=`
          <h2>${TYPES[S.type].title} 완료!</h2>
          <div class="score">${score}<small> / ${S.n}</small></div>
          <div class="dots">${dots}</div>
          <div class="actions">
            <a class="btn ghost" href="../">← 설정으로</a>
            <button class="btn" id="again">다시 풀기</button>
          </div>`;
        document.getElementById("again").onclick=()=>{const u=new URL(location);u.searchParams.set("seed",Math.random().toString(36).slice(2,9));location.href=u.toString();};
        window.scrollTo({top:0,behavior:"smooth"});
      }

      // 시드를 주소에 남겨 재현/공유 가능하게
      (function(){const u=new URL(location);if(!u.searchParams.get("seed")){u.searchParams.set("seed",PRM.seed);u.searchParams.set("type",PRM.type);u.searchParams.set("n",PRM.n);history.replaceState(null,"",u.toString());}})();

      // gen_config 정본 로드(리포) → 폴백(인라인) → 세션 생성 → 시작
      (async function init(){
        try{ const r=await fetch("../../assets/js/quiz/gen-config.json",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&j.levels) GEN_CONFIG=j; } }catch(e){}
        buildSession();
        track("quiz_run_start",{type:S.type,n:S.n,seed:S.seed});
        renderProblem();
      })();
    </script>
  </body>
</html>
