    <style id="preview-fallback">
      :root{--panel:#fff;--panel-2:#f7f9fc;--bg:#eef2f7;--ink:#182233;--muted:#6a7789;--muted-2:#8a95a6;--line:#e5eaf1;--line-2:#eef2f7;--accent:#3f3fbf;--accent-ink:#2d2d95;--accent-soft:#ecebfb;--add:#0f9d58;--add-soft:#e6f5ec;--del:#e0466b;--del-soft:#fce9ee;--shadow:0 6px 22px rgba(24,34,51,.12),0 1px 3px rgba(24,34,51,.08);--shadow-sm:0 2px 8px rgba(24,34,51,.10);--shadow-lg:0 18px 50px rgba(24,34,51,.16),0 3px 10px rgba(24,34,51,.08);--r:16px;--r-lg:22px;--font:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
      .site-top{display:flex;align-items:center;padding:12px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:#fff}
      .site-topin{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:1180px;margin:0 auto}

    <style>
      *{box-sizing:border-box}
      body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
      main{max-width:720px;margin:0 auto;padding:clamp(14px,3vw,24px) clamp(16px,4vw,32px) 60px}

      .topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
      .exit{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;text-decoration:none;white-space:nowrap}
      .exit:hover{border-color:#cfd8e6;color:var(--ink)}
      .prog{flex:1}
      .prog .lab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
      .prog .bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
      .prog .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

      .qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:clamp(16px,3vw,24px)}
      .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
      .qhead .type{font-weight:800;font-size:15px}
      .qhead .lv{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
      .qhead .mode{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
      .qhead .edge{font-size:12px;font-weight:600;color:var(--muted);margin-left:auto}
      .qtext{font-size:clamp(16px,2.4vw,18px);font-weight:700;margin:10px 0 14px;letter-spacing:-.01em}

      .viewer{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
      .viewer svg{width:100%;max-width:360px;height:auto;max-height:230px}
      .rotrow{display:flex;gap:14px;align-items:center;justify-content:center}
      .rotbtn{width:46px;height:46px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer;color:var(--accent-ink);display:grid;place-items:center}
      .rotbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
      .rotbtn svg{width:22px;height:22px}
      .compass{width:56px;height:56px;flex:none}
      .compass svg{width:100%;height:100%;display:block}
      .rotcap{font-size:12px;color:var(--muted);font-weight:600;text-align:center;margin-top:2px}

      .v3d{width:100%;height:230px;border-radius:var(--r);overflow:hidden;background:var(--panel-2);touch-action:none}
      .v3d canvas{display:block;width:100%;height:100%}
      .rotrow2{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:8px}
      .compass3{width:56px;height:56px;flex:none}
      .compass3 svg{width:100%;height:100%;display:block}
      .rothint{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;line-height:1.35}

      .rotbtn2:hover{background:var(--accent-soft);border-color:var(--accent)}

      .numin input{width:130px;height:48px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:20px;font-weight:800;text-align:center;color:var(--ink);background:var(--panel)}
      .numin input:focus{border-color:var(--accent);outline:none}
      .numin .unit{font-size:16px;font-weight:700;color:var(--muted)}

      .hmgrid{display:inline-grid;gap:4px;background:var(--panel);padding:8px;border:1px solid var(--line);border-radius:12px}
      .hmcell{width:42px;height:42px;border-radius:8px;display:grid;place-items:center}
      .hmcell.empty{background:var(--line-2)}
      .hmcell.fill{background:var(--accent-soft)}
      .hmcell input{width:100%;height:100%;border:1.5px solid var(--accent);border-radius:8px;background:var(--panel);font-family:inherit;font-size:18px;font-weight:800;text-align:center;color:var(--accent-ink)}
      .hmcell input:focus{outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
      .hint{font-size:12.5px;color:var(--muted);margin-top:8px}

      .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
      .opt{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;cursor:pointer;display:flex;justify-content:center;transition:.12s}
      .opt:hover{border-color:#cfd8e6}
      .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
      .opt.correct{border-color:var(--add);background:var(--add-soft)}
      .opt.wrong{border-color:var(--del);background:var(--del-soft)}
      .opt svg{height:74px;width:auto}

      .actions{margin-top:18px;display:flex;gap:10px}
      .btn{border:none;cursor:pointer;font-weight:800;font-size:15px;padding:13px 18px;border-radius:14px;background:var(--accent);color:#fff;flex:1}
      .btn:hover{background:var(--accent-ink)}
      .btn:disabled{background:var(--panel-2);color:var(--muted-2);cursor:not-allowed}
      .btn.ghost{background:var(--panel);color:var(--accent-ink);border:1px solid var(--line);flex:0 0 auto}
      .btn.ghost:hover{background:var(--accent-soft)}

      .fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-weight:700;display:none}
      .fb.show{display:block}
      .fb.ok{background:var(--add-soft);color:#0b6e3e;border:1px solid #b7e2c7}
      .fb.no{background:var(--del-soft);color:#a52a49;border:1px solid #f2c3cf}
      .fb .sol{font-weight:600;font-size:13.5px;color:var(--ink);margin-top:6px;opacity:.9}

      .result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:clamp(20px,4vw,32px);text-align:center;display:none}
      .result.show{display:block}
      .result h2{margin:0 0 6px;font-size:22px}
      .score{font-size:44px;font-weight:900;color:var(--accent-ink);margin:6px 0}
      .score small{font-size:20px;color:var(--muted-2);font-weight:800}
      .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}
      .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
      .dot.o{background:var(--add)}.dot.x{background:var(--del)}
      .result .actions{max-width:420px;margin:18px auto 0}
      .footnote{color:var(--muted-2);font-size:12px;line-height:1.7;margin:22px 2px 0;text-align:center}
      :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
    </style>

    <script>
      /* ===== 시드 RNG ===== */
      function xmur3(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;};}
      function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
      function rngFrom(str){const s=xmur3(str);return mulberry32(s());}

      /* ===== 유형 · 난이도 설정 ===== */
      const TYPES={
        count:{title:"개수 세기",ask:"쌓기나무는 모두 몇 개일까요?",form:"num",unit:"개"},
        volume:{title:"부피 구하기",ask:"이 모양의 부피는 얼마일까요?",form:"num",unit:"cm³",edge:true},
        surface:{title:"겉넓이 구하기",ask:"겉넓이는 얼마일까요? (바닥 포함)",form:"num",unit:"cm²",edge:true},
        heightmap:{title:"위에서 본 수 쓰기",ask:"위에서 본 모양의 각 칸에 쌓인 나무 수를 쓰세요.",form:"hm"},
        facesMc:{title:"위·앞·옆 모양 고르기",ask:"이 모양을 앞에서 본 모양을 고르세요.",form:"mc"},
      };
      /* gen_config (분류 체계 §7.3) — 정본은 assets/js/quiz/gen-config.json.
         아래는 프리뷰/오프라인 폴백 사본(리포에선 fetch로 덮어씀). */
      const INLINE_CONFIG={
        version:"0.1.0",
        levels:{
          "하":{gx:3,gz:3,maxH:2,fMin:3,fMax:4,nMin:4,nMax:6,edge:1},
          "중":{gx:3,gz:3,maxH:3,fMin:4,fMax:5,nMin:6,nMax:9,edge:1},
          "상":{gx:4,gz:4,maxH:3,fMin:5,fMax:7,nMin:9,nMax:14,edge:2},
          "최상":{gx:4,gz:4,maxH:4,fMin:6,fMax:9,nMin:12,nMax:18,edge:2},
        }
      };
      let GEN_CONFIG=INLINE_CONFIG;
      const LVCODE={1:"하",2:"중",3:"상",4:"최상"};

      /* F1 계측 — 동의 후 로드된 gtag가 있을 때만(오리진 공유 consent 정본). */
      function track(name,params){ try{ if(window.gtag) window.gtag('event',name,params||{}); }catch(e){} }

      /* ===== 모양 생성 ===== */
      function genShape(rng,cfg){
        const {gx,gz,maxH}=cfg;
        const ri=n=>Math.floor(rng()*n), rr=(a,b)=>a+Math.floor(rng()*(b-a+1));
        let f=Math.min(rr(cfg.fMin,cfg.fMax),gx*gz);
        const foot=new Set(); let sx=ri(gx),sz=ri(gz); foot.add(sx+","+sz);
        while(foot.size<f){
          const cand=[];
          foot.forEach(k=>{const[x,z]=k.split(",").map(Number);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dz])=>{const nx=x+dx,nz=z+dz;if(nx>=0&&nx<gx&&nz>=0&&nz<gz&&!foot.has(nx+","+nz))cand.push(nx+","+nz);});});
          if(!cand.length)break; foot.add(cand[ri(cand.length)]);
        }
        const arr=[...foot].map(k=>k.split(",").map(Number));
        const H={}; arr.forEach(([x,z])=>H[x+","+z]=1);
        let N=Math.max(arr.length,Math.min(rr(cfg.nMin,cfg.nMax),arr.length*maxH));
        let rem=N-arr.length;
        let guard=0;
        while(rem>0&&guard++<999){const opts=arr.filter(([x,z])=>H[x+","+z]<maxH);if(!opts.length)break;const[x,z]=opts[ri(opts.length)];H[x+","+z]++;rem--;}
        const hmap=Array.from({length:gx},()=>Array(gz).fill(0));
        const cells=[]; let count=0;
        arr.forEach(([x,z])=>{const h=H[x+","+z];hmap[x][z]=h;count+=h;for(let y=0;y<h;y++)cells.push({x,y,z});});
        const set=new Set(cells.map(c=>c.x+","+c.y+","+c.z));
        let pairs=0; cells.forEach(c=>{[[1,0,0],[0,1,0],[0,0,1]].forEach(([a,b,d])=>{if(set.has((c.x+a)+","+(c.y+b)+","+(c.z+d)))pairs++;});});
        const exposed=6*count-2*pairs;
        return {gx,gz,maxH,hmap,cells,count,pairs,exposed,edge:cfg.edge};
      }

      /* ===== 아이소 뷰어 ===== */
      function rot(p,k,gx,gz){const{x,y,z}=p;if(k===1)return{x:gz-1-z,y,z:x};if(k===2)return{x:gx-1-x,y,z:gz-1-z};if(k===3)return{x:z,y,z:gx-1-x};return{x,y,z};}
      function renderIso(sh,k){
        const a=20,b=10,c=24;
        const cells=sh.cells.map(p=>rot(p,k,sh.gx,sh.gz));
        cells.sort((p,q)=>(p.x+p.z)-(q.x+q.z)||p.y-q.y);
        let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
        const P=(x,y,z)=>{const X=a*(x-z),Y=b*(x+z)-c*y;if(X<minX)minX=X;if(X>maxX)maxX=X;if(Y<minY)minY=Y;if(Y>maxY)maxY=Y;return X+","+Y;};
        let poly="";
        for(const{x,y,z}of cells){
          const top=`${P(x,y+1,z)} ${P(x+1,y+1,z)} ${P(x+1,y+1,z+1)} ${P(x,y+1,z+1)}`;
          const left=`${P(x,y,z+1)} ${P(x+1,y,z+1)} ${P(x+1,y+1,z+1)} ${P(x,y+1,z+1)}`;
          const right=`${P(x+1,y,z)} ${P(x+1,y,z+1)} ${P(x+1,y+1,z+1)} ${P(x+1,y+1,z)}`;
          poly+=`<polygon points="${left}" fill="#d8a76e" stroke="#9c6b30" stroke-width="1" stroke-linejoin="round"/><polygon points="${right}" fill="#c8965a" stroke="#9c6b30" stroke-width="1" stroke-linejoin="round"/><polygon points="${top}" fill="#e6c9a0" stroke="#9c6b30" stroke-width="1" stroke-linejoin="round"/>`;
        }
        const pad=14,w=(maxX-minX)+pad*2,h=(maxY-minY)+pad*2;
        return `<svg viewBox="${minX-pad} ${minY-pad} ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${poly}</svg>`;
      }
      function renderSil(heights,maxH){
        const s=15,g=2,w=heights.length*(s+g)+g,h=maxH*(s+g)+g;let r="";
        for(let x=0;x<heights.length;x++)for(let y=0;y<maxH;y++){const on=y<heights[x];r+=`<rect x="${g+x*(s+g)}" y="${g+(maxH-1-y)*(s+g)}" width="${s}" height="${s}" rx="3" fill="${on?'var(--accent)':'var(--line-2)'}"/>`;}
        return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
      }
      function frontHeights(sh){const a=[];for(let x=0;x<sh.gx;x++){let m=0;for(let z=0;z<sh.gz;z++)m=Math.max(m,sh.hmap[x][z]);a.push(m);}return a;}
      // 나침반: 위에서 본 정사각형이 회전(원래 '앞'면=아래 굵은 선). 얼마나·어느 쪽으로 돌렸는지 직관 표시.
      function renderCompass(k){
        const ang=k*90;
        return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="26" fill="var(--panel-2)" stroke="var(--line)"/>
          <g transform="rotate(${ang} 30 30)">
            <rect x="19" y="19" width="22" height="22" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
            <line x1="19" y1="41" x2="41" y2="41" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round"/>
            <path d="M30 47 l-3.4 -4.4 h6.8 z" fill="var(--accent)"/>
          </g>
          <text x="30" y="12" text-anchor="middle" font-size="8" font-weight="800" fill="var(--muted-2)">나</text>
        </svg>`;
      }
      const ARC_CW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4.5v4.5h-4.5"/></svg>';
      const ARC_CCW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4.5h4.5"/></svg>';

      /* ===== 정본 3D 뷰어 (playground Three.js 재사용 · 관찰 전용) ===== */
      // 축: 옆=+x, 위=+y, 앞=+z (마스터 3.2). 직교 투영(3.5). 편집 없음(3.6).
      const AXES3=[
        {v:[1,0,0],label:"옆",color:"#d0546f"},
        {v:[0,1,0],label:"위",color:"#3f8fd0"},
        {v:[0,0,1],label:"앞",color:"#4fae72"},
      ];
      const SPH0={theta:-0.7+Math.PI+Math.PI/2+Math.PI,phi:1.02};
      let CURVIEW=null;
      function mount3D(host,sh,compassSvg){
        const S=1,gx=sh.gx,gz=sh.gz,gy=Math.max(...sh.cells.map(c=>c.y))+1;
        const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
        renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
        host.innerHTML=""; host.appendChild(renderer.domElement);
        const scene=new THREE.Scene();
        scene.add(new THREE.HemisphereLight(0xffffff,0x9aa7b5,0.9));
        scene.add(new THREE.AmbientLight(0xffffff,0.32));
        const dl=new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(6,11,4); scene.add(dl);
        const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
        const target=new THREE.Vector3(0,gy*S/2,0);
        const group=new THREE.Group(); scene.add(group);
        const geo=new THREE.BoxGeometry(S*0.98,S*0.98,S*0.98), egeo=new THREE.EdgesGeometry(geo);
        const mat=new THREE.MeshLambertMaterial({color:0xe4b878});
        const emat=new THREE.LineBasicMaterial({color:0x8a5a24,transparent:true,opacity:0.45});
        sh.cells.forEach(c=>{
          const px=(c.x-(gx-1)/2)*S,py=(c.y+0.5)*S,pz=(c.z-(gz-1)/2)*S;
          const m=new THREE.Mesh(geo,mat); m.position.set(px,py,pz); group.add(m);
          const e=new THREE.LineSegments(egeo,emat); e.position.set(px,py,pz); group.add(e);
        });
        const sph={theta:SPH0.theta,phi:SPH0.phi,radius:14}, maxDim=Math.max(gx,gy,gz);
        function applyCam(){const p=new THREE.Vector3(Math.sin(sph.phi)*Math.sin(sph.theta),Math.cos(sph.phi),Math.sin(sph.phi)*Math.cos(sph.theta)).multiplyScalar(sph.radius).add(target);cam.position.copy(p);cam.up.set(0,1,0);cam.lookAt(target);}
        function resize(){const w=host.clientWidth||320,h=host.clientHeight||220;renderer.setSize(w,h,false);const aspect=w/h,Hf=(maxDim+1.5)*S;cam.left=-Hf*aspect/2;cam.right=Hf*aspect/2;cam.top=Hf/2;cam.bottom=-Hf/2;cam.updateProjectionMatrix();}
        // 나침반
        let cels=null;
        if(compassSvg){
          compassSvg.innerHTML='<circle cx="37" cy="37" r="30" fill="var(--panel-2)" stroke="var(--line)"/>';
          const ns="http://www.w3.org/2000/svg";
          cels=AXES3.map(()=>{const line=document.createElementNS(ns,"line");line.setAttribute("stroke-width","2.4");line.setAttribute("stroke-linecap","round");const dot=document.createElementNS(ns,"circle");dot.setAttribute("r","8.5");const txt=document.createElementNS(ns,"text");txt.setAttribute("text-anchor","middle");txt.setAttribute("dominant-baseline","central");txt.setAttribute("font-size","9");txt.setAttribute("font-weight","800");txt.setAttribute("fill","#fff");compassSvg.appendChild(line);compassSvg.appendChild(dot);compassSvg.appendChild(txt);return {line,dot,txt};});
        }
        function updateCompass(){if(!cels)return;const q=cam.quaternion.clone().invert();const cx=37,cy=37,R=19;AXES3.map((a,i)=>{const v=new THREE.Vector3(a.v[0],a.v[1],a.v[2]).applyQuaternion(q);return{i,a,sx:cx+v.x*R,sy:cy-v.y*R,z:v.z};}).sort((p,r)=>p.z-r.z).forEach(it=>{const{line,dot,txt}=cels[it.i];const op=0.35+((it.z+1)/2)*0.65;line.setAttribute("x1",cx);line.setAttribute("y1",cy);line.setAttribute("x2",it.sx);line.setAttribute("y2",it.sy);line.setAttribute("stroke",it.a.color);line.setAttribute("opacity",op);dot.setAttribute("cx",it.sx);dot.setAttribute("cy",it.sy);dot.setAttribute("fill",it.a.color);dot.setAttribute("opacity",op);txt.setAttribute("x",it.sx);txt.setAttribute("y",it.sy);txt.setAttribute("opacity",op);txt.textContent=it.a.label;});}
        // 드래그 회전
        const el=renderer.domElement; el.style.cursor="grab"; let drag=false,lx=0,ly=0;
        el.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;el.style.cursor="grabbing";el.setPointerCapture&&el.setPointerCapture(e.pointerId);});
        el.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;sph.theta-=dx*0.008;sph.phi=Math.max(0.12,Math.min(Math.PI-0.12,sph.phi-dy*0.008));});
        const end=()=>{drag=false;el.style.cursor="grab";};
        el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end); el.addEventListener("pointerleave",end);
        let raf; function loop(){applyCam();updateCompass();renderer.render(scene,cam);raf=requestAnimationFrame(loop);}
        const onR=()=>resize(); window.addEventListener("resize",onR);
        resize(); loop();
        return {dispose(){cancelAnimationFrame(raf);window.removeEventListener("resize",onR);geo.dispose();egeo.dispose();mat.dispose();emat.dispose();renderer.dispose();host.innerHTML="";},reset(){sph.theta=SPH0.theta;sph.phi=SPH0.phi;}};
      }

      /* ===== 세션 구성 ===== */
      function loadParams(){
        const p=new URLSearchParams(location.search);
        let type=p.get("type");if(!TYPES[type])type="count";
        let levels=(p.get("lv")||"1234").split("").map(c=>LVCODE[c]).filter(Boolean);if(!levels.length)levels=["하","중","상","최상"];
        let n=Math.min(30,Math.max(5,+(p.get("n")||10)));
        let seed=p.get("seed")||Math.random().toString(36).slice(2,9);
        let dim=p.get("dim")||"all"; // 3d=3D 임베드 / 2d=2D 겨냥도 / all=기본(3D)
        return {type,levels,n,seed,dim};
      }
      const PRM=loadParams();
      const S={type:PRM.type,seed:PRM.seed,n:PRM.n,idx:0,probs:[],answered:[]};
      function buildSession(){
        S.probs=[];
        const rngL=rngFrom(PRM.seed+":L");
        for(let i=0;i<PRM.n;i++){
          const lv=PRM.levels[Math.floor(rngL()*PRM.levels.length)];
          const sh=genShape(rngFrom(PRM.seed+":"+i),GEN_CONFIG.levels[lv]);
          const pr={type:PRM.type,lv,sh};
          if(PRM.type==="facesMc"){
            const corr=frontHeights(sh),maxH=Math.max(...corr,1);
            const cand=[corr.slice()],seen=new Set([corr.join(",")]);
            const rngD=rngFrom(PRM.seed+":d"+i);const ri=n=>Math.floor(rngD()*n);
            let g=0;
            while(cand.length<4&&g++<40){
              const v=corr.slice();const idx=ri(v.length);const mode=ri(3);
              if(mode===0)v[idx]=Math.max(0,Math.min(maxH,v[idx]+(ri(2)?1:-1)));
              else if(mode===1)v.reverse();
              else{const j=ri(v.length);const t=v[idx];v[idx]=v[j];v[j]=t;}
              const key=v.join(",");if(!seen.has(key)){seen.add(key);cand.push(v);}
            }
            while(cand.length<4){const v=corr.map(h=>Math.max(0,Math.min(maxH,h+(ri(3)-1))));const key=v.join(",");if(!seen.has(key)){seen.add(key);cand.push(v);}}
            for(let k=cand.length-1;k>0;k--){const j=ri(k+1);[cand[k],cand[j]]=[cand[j],cand[k]];}
            pr.opts=cand;pr.correct=cand.findIndex(v=>v.join(",")===corr.join(","));pr.maxH=maxH;
          }
          S.probs.push(pr);
        }
      }

      /* ===== 렌더 ===== */
      const qcard=document.getElementById("qcard"),resultEl=document.getElementById("result");
      let ROT=0,PICK=-1;
      function renderProblem(){
        ROT=0;PICK=-1;
        const pr=S.probs[S.idx],T=TYPES[pr.type],sh=pr.sh;
        document.getElementById("pg-type").textContent=T.title;
        document.getElementById("pg-num").textContent=(S.idx+1)+" / "+S.n;
        document.getElementById("pg-fill").style.width=(S.idx/S.n*100)+"%";
        let ans="";
        if(T.form==="num"){
          ans=`<div class="numin"><input id="ans" type="number" inputmode="numeric" autocomplete="off" placeholder="?"/><span class="unit">${T.unit}</span></div>`;
        }else if(T.form==="hm"){
          let cells="";
          for(let z=0;z<sh.gz;z++)for(let x=0;x<sh.gx;x++){
            const h=sh.hmap[x][z];
            cells+=`<div class="hmcell ${h>0?'fill':'empty'}" style="grid-column:${x+1};grid-row:${z+1}">${h>0?`<input data-x="${x}" data-z="${z}" type="number" inputmode="numeric" min="1" max="${sh.maxH}"/>`:''}</div>`;
          }
          ans=`<div class="hmgrid" style="grid-template-columns:repeat(${sh.gx},42px)">${cells}</div><div class="hint">색칠된 칸(위에서 보이는 칸)에만 수를 써요.</div>`;
        }else if(T.form==="mc"){
          ans=`<div class="opts">${pr.opts.map((v,i)=>`<button class="opt" data-i="${i}">${renderSil(v,pr.maxH)}</button>`).join("")}</div>`;
        }
        const edge=T.edge?`<span class="edge">쌓기나무 한 모서리 = ${sh.edge}cm</span>`:"";
        const has3D=!!window.THREE && PRM.dim!=="2d";
        const viewLabel=has3D?"3D 문제":"2D 겨냥도";
        const viewerHTML=has3D
          ? `<div class="viewer"><div id="v3d" class="v3d"></div><div class="rotrow2"><div class="compass3"><svg id="compassSvg" viewBox="0 0 74 74"></svg></div><div class="rothint">돌려서 <b>숨은 나무</b>를 확인해요<br><span>손가락·마우스로 회전</span></div><button id="reset3d" class="rotbtn2" type="button">정면</button></div></div>`
          : `<div class="viewer"><div id="iso">${renderIso(sh,0)}</div><div class="rotrow"><button id="rl" class="rotbtn" aria-label="반시계 방향으로 돌리기">${ARC_CCW}</button><div id="compass" class="compass" aria-hidden="true">${renderCompass(0)}</div><button id="rr" class="rotbtn" aria-label="시계 방향으로 돌리기">${ARC_CW}</button></div><div class="rotcap" id="rotcap">돌려서 숨은 나무를 확인해요 · 앞면 기준 0°</div></div>`;
        qcard.innerHTML=`
          <div class="qhead"><span class="type">${T.title}</span><span class="lv">${pr.lv}</span><span class="mode">${viewLabel}</span>${edge}</div>
          <div class="qtext">${T.ask}</div>
          ${viewerHTML}
          <div class="answer">${ans}</div>
          <div class="fb" id="fb"></div>
          <div class="actions"><button class="btn" id="submit">제출</button></div>`;
        if(CURVIEW&&CURVIEW.dispose){CURVIEW.dispose();CURVIEW=null;}
        if(has3D){
          CURVIEW=mount3D(document.getElementById("v3d"),sh,document.getElementById("compassSvg"));
          const rb=document.getElementById("reset3d"); if(rb)rb.onclick=()=>{CURVIEW&&CURVIEW.reset();track("quiz_view_reset",{});};
        }else{
          const updRot=()=>{document.getElementById("iso").innerHTML=renderIso(sh,ROT);document.getElementById("compass").innerHTML=renderCompass(ROT);document.getElementById("rotcap").textContent=`돌려서 숨은 나무를 확인해요 · 앞면 기준 ${ROT*90}°`;};
          document.getElementById("rl").onclick=()=>{ROT=(ROT+3)%4;updRot();track("quiz_rotate",{dir:"ccw",deg:ROT*90});};
          document.getElementById("rr").onclick=()=>{ROT=(ROT+1)%4;updRot();track("quiz_rotate",{dir:"cw",deg:ROT*90});};
        }
        if(T.form==="mc"){qcard.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(b.classList.contains("done"))return;PICK=+b.dataset.i;qcard.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));b.classList.add("sel");});}
        document.getElementById("submit").onclick=submit;
        const first=qcard.querySelector("input");if(first)first.focus();
      }

      function submit(){
        const pr=S.probs[S.idx],T=TYPES[pr.type],sh=pr.sh;
        let ok=false,sol="";
        if(T.form==="num"){
          const v=parseInt(document.getElementById("ans").value,10);
          if(isNaN(v)){document.getElementById("ans").focus();return;}
          let a=sh.count;
          if(pr.type==="volume"){a=sh.count*sh.edge**3;sol=`${sh.count}개 × (${sh.edge}cm)³ = ${a}cm³`;}
          else if(pr.type==="surface"){a=sh.exposed*sh.edge**2;sol=`드러난 면 ${sh.exposed}개 × (${sh.edge}cm)² = ${a}cm²`;}
          else sol=`채운 칸을 모두 세면 ${a}개예요.`;
          ok=v===a;
        }else if(T.form==="hm"){
          ok=true;let bad=false;
          qcard.querySelectorAll(".hmcell input").forEach(inp=>{const x=+inp.dataset.x,z=+inp.dataset.z;const v=parseInt(inp.value,10);if(isNaN(v)){bad=true;}if(v!==sh.hmap[x][z]){ok=false;inp.style.borderColor="var(--del)";}else{inp.style.borderColor="var(--add)";}inp.disabled=true;});
          if(bad&&ok===true){/*빈칸 있으면 오답 처리*/}
          if(bad)ok=false;
          sol="각 칸의 수 = 그 자리에 쌓인 나무 층 수예요.";
        }else if(T.form==="mc"){
          if(PICK<0)return;
          ok=PICK===pr.correct;
          qcard.querySelectorAll(".opt").forEach((o,i)=>{o.classList.add("done");if(i===pr.correct)o.classList.add("correct");else if(i===PICK)o.classList.add("wrong");o.style.pointerEvents="none";});
          sol="앞에서 볼 때 각 줄의 가장 높은 칸까지 보여요.";
        }
        S.answered[S.idx]=ok;
        track("quiz_answer",{type:pr.type,level:pr.lv,correct:ok,idx:S.idx});
        const fb=document.getElementById("fb");
        fb.className="fb show "+(ok?"ok":"no");
        fb.innerHTML=(ok?"⭕ 정답이에요!":"❌ 아쉬워요")+`<div class="sol">${sol}</div>`;
        const act=qcard.querySelector(".actions");
        act.innerHTML=`<button class="btn" id="next">${S.idx+1<S.n?"다음 →":"결과 보기"}</button>`;
        document.getElementById("next").onclick=next;
        document.getElementById("pg-fill").style.width=((S.idx+1)/S.n*100)+"%";
      }
      function next(){if(S.idx+1<S.n){S.idx++;renderProblem();window.scrollTo({top:0,behavior:"smooth"});}else showResult();}

      function showResult(){
        if(CURVIEW&&CURVIEW.dispose){CURVIEW.dispose();CURVIEW=null;}
        qcard.style.display="none";document.getElementById("topbar").style.display="none";
        const score=S.answered.filter(Boolean).length;
        const dots=S.answered.map((o,i)=>`<span class="dot ${o?'o':'x'}">${i+1}</span>`).join("");
        try{localStorage.setItem("cubenest_quiz_last",JSON.stringify({type:S.type,seed:S.seed,n:S.n,score,ts:Date.now()}));}catch(e){}
        track("quiz_run_complete",{type:S.type,n:S.n,score,seed:S.seed});
        resultEl.className="result show";
        resultEl.innerHTML=`
          <h2>${TYPES[S.type].title} 완료!</h2>
          <div class="score">${score}<small> / ${S.n}</small></div>
          <div class="dots">${dots}</div>
          <div class="actions">
            <a class="btn ghost" href="../">← 설정으로</a>
            <button class="btn" id="again">다시 풀기</button>
          </div>`;
        document.getElementById("again").onclick=()=>{const u=new URL(location);u.searchParams.set("seed",Math.random().toString(36).slice(2,9));location.href=u.toString();};
        window.scrollTo({top:0,behavior:"smooth"});
      }

      // 시드를 주소에 남겨 재현/공유 가능하게
      (function(){const u=new URL(location);if(!u.searchParams.get("seed")){u.searchParams.set("seed",PRM.seed);u.searchParams.set("type",PRM.type);u.searchParams.set("n",PRM.n);history.replaceState(null,"",u.toString());}})();

      // gen_config 정본 로드(리포) → 폴백(인라인) → 세션 생성 → 시작
      (async function init(){
        try{ const r=await fetch("../../assets/js/quiz/gen-config.json",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&j.levels) GEN_CONFIG=j; } }catch(e){}
        buildSession();
        track("quiz_run_start",{type:S.type,n:S.n,seed:S.seed});
        renderProblem();
      })();
    </script>
  </body>
</html>
